<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flujo de Efectivo — Aserradero Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFEA; --surface:#FFFFFF; --surface-2:#FAF8F4;
  --ink:#2B2620; --ink-soft:#6B6255;
  --accent:#BE6A1E; --pine:#3F5D3A; --danger:#A23B2E; --danger-bg:#F5DFDA;
  --line:#DCD5C7; --line-soft:#EAE5D9;
  --radius:10px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;}
.hidden{display:none !important;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 32px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;}
.topbar h1{font-size:21px;font-weight:600;}
.topbar p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.conn-badge{font-size:12px;font-weight:600;margin-right:6px;}

.tabs{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;position:sticky;top:73px;z-index:4;}
.tab-item{padding:14px 16px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-view{display:none;}
.tab-view.active{display:block;}

.content{max-width:1180px;margin:0 auto;padding:22px 32px 60px;}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s ease, border-color .15s ease, transform .1s ease;}
.btn:hover{border-color:#c8c0ac;background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-accent:hover{background:#a55a17;border-color:#a55a17;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.section-head{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.section-head input, .section-head select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
.search-input{flex:1;min-width:180px;}
.filter-label{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}

.summary-bar{display:flex;gap:24px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;}
.summary-item .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.summary-item .value{font-family:var(--font-mono);font-size:19px;font-weight:600;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-soft);}
.panel-head h3{font-size:14px;}

.cat-block{margin-bottom:18px;}
.cat-block:last-child{margin-bottom:0;}
.cat-block .cat-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:5px;gap:10px;}
.cat-block .cat-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-bar-bg{background:var(--line-soft);border-radius:6px;height:7px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:6px;}
.cat-block.ingreso .cat-bar-fill{background:var(--pine);}
.cat-block.egreso .cat-bar-fill{background:var(--danger);}
.desc-list{margin:8px 0 4px 4px;padding-left:14px;border-left:2px solid var(--line-soft);}
.desc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:3px 0;gap:10px;}
.desc-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.desc-row span:last-child{font-family:var(--font-mono);color:var(--ink);flex-shrink:0;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 14px;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.num{font-family:var(--font-mono);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;}
.badge-entrada{background:#E4EEE1;color:#3F5D3A;}
.badge-salida{background:#F6E4DE;color:#A23B2E;}

.empty-state{padding:40px 24px;text-align:center;color:var(--ink-soft);}
.empty-state h4{margin:0 0 6px;color:var(--ink);font-size:15px;}
.empty-state p{margin:0 0 16px;font-size:13.5px;}

.modal-overlay{position:fixed;inset:0;background:rgba(24,20,15,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);}
.modal-head h2{font-size:17px;}
.modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:2px 6px;}
.modal-body{padding:20px 22px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink-soft);}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);}
.form-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:6px;}

.cat-manage-col h4{font-size:13px;margin-bottom:10px;}
.cat-tags{display:flex;flex-wrap:wrap;gap:8px;min-height:28px;}
.cat-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);padding:5px 6px 5px 10px;border-radius:20px;font-size:12.5px;}
.cat-tag button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:15px;line-height:1;padding:0 4px;}
.cat-tag button:hover{color:var(--danger);}
.empty-hint{font-size:12.5px;color:var(--ink-soft);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.toast.hidden{display:none;}
.toast.error{background:var(--danger);}

#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;font-family:var(--font-display);color:var(--ink-soft);font-size:14px;padding:20px;text-align:center;}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
@media (max-width:760px){
  .topbar{padding:16px 18px;} .tabs{padding:0 18px;top:97px;} .content{padding:18px 16px 48px;}
  .form-cols{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="loading-screen">Cargando datos…</div>

<header class="topbar">
  <div><h1>Flujo de Efectivo</h1><p>Aserradero Control · módulo independiente conectado a Supabase</p></div>
  <div class="header-actions">
    <span id="conn-status" class="conn-badge">● Conectando…</span>
    <button class="btn" onclick="openImportModal()">Importar CSV</button>
    <button class="btn" onclick="openSaldosModal()">Saldo inicial</button>
    <button class="btn" onclick="openCategoriasModal()">Gestionar categorías</button>
    <button class="btn btn-accent" onclick="openFlujoModal()">+ Nuevo registro</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-item active" data-tab="registros" onclick="showTab('registros')">Registros</button>
  <button class="tab-item" data-tab="reportes" onclick="showTab('reportes')">Reportes</button>
</nav>

<div class="content">

  <section id="tab-registros" class="tab-view active">
    <div class="section-head">
      <span class="filter-label">Desde <input type="date" id="f-desde" onchange="refreshAll()"></span>
      <span class="filter-label">Hasta <input type="date" id="f-hasta" onchange="refreshAll()"></span>
      <select id="f-tipo" onchange="refreshAll()">
        <option value="">Todos los tipos</option>
        <option value="ingreso">Ingresos</option>
        <option value="egreso">Egresos</option>
      </select>
      <select id="f-categoria" onchange="refreshAll()"><option value="">Todas las categorías</option></select>
      <input type="text" id="f-buscar" class="search-input" placeholder="Buscar en descripción..." oninput="refreshAll()">
      <button class="btn btn-sm" onclick="clearFilters()">Ver todo</button>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div class="panel">
      <div class="panel-head"><h3>Registros</h3><button class="btn btn-sm" onclick="exportarCSV()">Exportar CSV</button></div>
      <div id="flujo-table-wrap" class="table-wrap"></div>
    </div>
  </section>

  <section id="tab-reportes" class="tab-view">
    <div class="section-head">
      <span class="filter-label">Desde <input type="date" id="rep-desde" onchange="renderReportesTab()"></span>
      <span class="filter-label">Hasta <input type="date" id="rep-hasta" onchange="renderReportesTab()"></span>
      <button class="btn btn-sm" onclick="clearReportFilters()">Ver todo</button>
      <button class="btn btn-sm" onclick="exportarReporteCSV()">Exportar reporte CSV</button>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Ingresos por categoría y descripción</h3></div>
      <div id="rep-ingresos-jerarquia" style="padding:20px;"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Egresos por categoría y descripción</h3></div>
      <div id="rep-egresos-jerarquia" style="padding:20px;"></div>
    </div>
  </section>

</div>

<div class="modal-overlay hidden" id="modal-overlay"><div class="modal" id="modal"></div></div>
<div class="toast hidden" id="toast"></div>

<script>
/* ============================================================================
   CONFIGURACIÓN DE SUPABASE — reemplaza estos dos valores con los de tu
   proyecto (panel de Supabase → Settings → API → Project URL / anon public key)
   ============================================================================ */
const SUPABASE_URL = "https://rfwgtlrqxsxkxeclodfe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bNOnHwP_H4vG3qvfrJx6-A_rj-oETbx";
const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('TU-PROYECTO') && !SUPABASE_ANON_KEY.includes('TU-LLAVE');

/* ===================== Estado ===================== */
let flujo = [];
let categoriasIngreso = [];
let categoriasEgreso = [];
let descripcionesPorCategoria = {};
let saldosIniciales = {}; // { 'YYYY-MM': monto }

/* ===================== Cliente REST de Supabase (sin librerías externas) ===================== */
function sbHeaders(extra){
  return Object.assign({apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}, extra||{});
}
async function sbSelect(table, query){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query||''}`, {headers: sbHeaders()});
  if(!res.ok) throw new Error(`Error al leer ${table}`);
  return res.json();
}
async function sbInsert(table, row){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error(`Error al guardar en ${table}`);
  const data = await res.json();
  return data[0];
}
async function sbUpdate(table, id, patch){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method:'PATCH',
    headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error(`Error al actualizar ${table}`);
  const data = await res.json();
  return data[0];
}
async function sbDelete(table, id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {method:'DELETE', headers: sbHeaders()});
  if(!res.ok) throw new Error(`Error al eliminar de ${table}`);
}
async function sbDeleteWhere(table, filterQuery){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${filterQuery}`, {method:'DELETE', headers: sbHeaders()});
  if(!res.ok) throw new Error(`Error al eliminar de ${table}`);
}
async function sbUpsert(table, row, onConflict){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
    method:'POST',
    headers: sbHeaders({'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=representation'}),
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error(`Error al guardar en ${table}`);
  const data = await res.json();
  return data[0] || row;
}

/* ===================== Utilidades ===================== */
function formatMoney(n){ return (n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}); }
function formatDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return new Date(Number(y), Number(m)-1, Number(d)).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function formatMes(ym){
  const [y,m] = ym.split('-');
  const s = new Date(Number(y), Number(m)-1, 1).toLocaleDateString('es-MX',{month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function downloadCSV(filename, headerRow, dataRows){
  const esc = (v) => {
    v = v===undefined||v===null? '': String(v);
    if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
    return v;
  };
  const lines = [headerRow, ...dataRows].map(row => row.map(esc).join(','));
  const blob = new Blob(["\uFEFF" + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* ignorar */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || r[0]!=='');
}

/* ===================== Modal / Toast ===================== */
function openModal(title, innerHtml){
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-head"><h2>${title}</h2><button class="modal-close" type="button" onclick="closeModal()" aria-label="Cerrar">&times;</button></div>${innerHtml}`;
  overlay.classList.remove('hidden');
  setTimeout(()=>{ const first = modal.querySelector('input,select,textarea'); if(first) first.focus(); }, 50);
}
function openFormModal(title, bodyHtml, onSubmit){
  openModal(title, `<form id="modal-form">${bodyHtml}</form>`);
  document.getElementById('modal-form').addEventListener('submit', async (e)=>{ e.preventDefault(); await onSubmit(); });
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal').innerHTML='';
}
function confirmDialog(message, onYes){
  openFormModal('Confirmar', `<div class="modal-body"><p>${escapeHtml(message)}</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-danger">Eliminar</button></div></div>`, async ()=>{ await onYes(); closeModal(); });
}
let toastTimer;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden'); t.classList.toggle('error', !!isError);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.add('hidden'), 3200);
}
document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* ===================== Pestañas ===================== */
function showTab(tab){
  document.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-view').forEach(v=>v.classList.toggle('active', v.id==='tab-'+tab));
  if(tab==='reportes') renderReportesTab();
}

/* ===================== Filtros y render — pestaña Registros ===================== */
function getFilteredRows(){
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  const tipoF = document.getElementById('f-tipo').value;
  const catF = document.getElementById('f-categoria').value;
  const buscar = (document.getElementById('f-buscar').value||'').toLowerCase();
  return flujo.filter(r=>{
    const matchDate = (!desde||r.fecha>=desde) && (!hasta||r.fecha<=hasta);
    const matchTipo = !tipoF || r.tipo===tipoF;
    const matchCat = !catF || r.categoria===catF;
    const matchBuscar = !buscar || (r.descripcion||'').toLowerCase().includes(buscar);
    return matchDate && matchTipo && matchCat && matchBuscar;
  }).sort((a,b)=> (b.fecha+b.id).localeCompare(a.fecha+a.id));
}
function refreshAll(){
  const rows = getFilteredRows();
  window._filteredRows = rows;
  renderSummary(rows);
  renderTable(rows);
}
function clearFilters(){
  document.getElementById('f-desde').value='';
  document.getElementById('f-hasta').value='';
  document.getElementById('f-tipo').value='';
  document.getElementById('f-categoria').value='';
  document.getElementById('f-buscar').value='';
  refreshAll();
}
function populateCategoriaFilterOptions(){
  const sel = document.getElementById('f-categoria');
  const current = sel.value;
  const all = [...new Set([...categoriasIngreso, ...categoriasEgreso])].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = `<option value="">Todas las categorías</option>` + all.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if(all.includes(current)) sel.value = current;
}
function renderSummary(rows){
  const ingresos = rows.filter(r=>r.tipo==='ingreso').reduce((s,r)=>s+r.monto,0);
  const egresos = rows.filter(r=>r.tipo==='egreso').reduce((s,r)=>s+r.monto,0);
  const desde = document.getElementById('f-desde').value;
  const mesDesde = desde ? desde.slice(0,7) : null;
  const tieneSaldo = mesDesde && saldosIniciales[mesDesde]!=null;
  const saldoInicial = tieneSaldo ? saldosIniciales[mesDesde] : 0;
  const saldoFinal = saldoInicial + ingresos - egresos;
  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-item"><div class="label">Saldo inicial${mesDesde?' ('+formatMes(mesDesde)+')':''}</div><div class="value">${tieneSaldo ? formatMoney(saldoInicial) : '—'}</div></div>
    <div class="summary-item"><div class="label">Ingresos</div><div class="value">${formatMoney(ingresos)}</div></div>
    <div class="summary-item"><div class="label">Egresos</div><div class="value">${formatMoney(egresos)}</div></div>
    <div class="summary-item"><div class="label">Saldo final</div><div class="value" style="color:${saldoFinal>=0?'var(--pine)':'var(--danger)'}">${formatMoney(saldoFinal)}</div></div>
    <div class="summary-item"><div class="label">Registros</div><div class="value">${rows.length}</div></div>
  `;
}
function renderTable(rows){
  const wrap = document.getElementById('flujo-table-wrap');
  if(flujo.length===0){
    wrap.innerHTML = `<div class="empty-state"><h4>Sin registros aún</h4><p>Registra tu primer ingreso o egreso.</p><button class="btn btn-accent" onclick="openFlujoModal()">+ Agregar el primero</button></div>`;
    return;
  }
  if(rows.length===0){ wrap.innerHTML = `<div class="empty-state"><h4>Sin resultados</h4><p>Ningún registro coincide con el filtro.</p></div>`; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr>

/* ===================== Pestaña Reportes: categoría → descripción ===================== */
function getReportRows(){
  const desde = document.getElementById('rep-desde').value;
  const hasta = document.getElementById('rep-hasta').value;
  return flujo.filter(r=> (!desde||r.fecha>=desde) && (!hasta||r.fecha<=hasta));
}
function clearReportFilters(){
  document.getElementById('rep-desde').value='';
  document.getElementById('rep-hasta').value='';
  renderReportesTab();
}
function renderReportesTab(){
  const rows = getReportRows();
  window._reportRows = rows;
  document.getElementById('rep-ingresos-jerarquia').innerHTML = buildJerarquia(rows, 'ingreso');
  document.getElementById('rep-egresos-jerarquia').innerHTML = buildJerarquia(rows, 'egreso');
}
function buildJerarquia(rows, tipo){
  const filtered = rows.filter(r=>r.tipo===tipo);
  if(filtered.length===0) return `<p class="empty-hint">Sin registros en este periodo.</p>`;
  const porCategoria = {};
  filtered.forEach(r=>{
    const cat = r.categoria || 'Sin categoría';
    const desc = r.descripcion || 'Sin descripción';
    if(!porCategoria[cat]) porCategoria[cat] = {};
    porCategoria[cat][desc] = (porCategoria[cat][desc]||0) + r.monto;
  });
  const grandTotal = filtered.reduce((s,r)=>s+r.monto,0);
  const categorias = Object.entries(porCategoria).map(([cat, descs])=>{
    const catTotal = Object.values(descs).reduce((a,b)=>a+b,0);
    return {cat, catTotal, descs};
  }).sort((a,b)=>b.catTotal-a.catTotal);

  return categorias.map(({cat, catTotal, descs})=>{
    const pct = grandTotal>0 ? (catTotal/grandTotal*100) : 0;
    const descEntries = Object.entries(descs).sort((a,b)=>b[1]-a[1]);
    return `<div class="cat-block ${tipo}">
      <div class="cat-top"><span>${escapeHtml(cat)}</span><span class="num">${formatMoney(catTotal)} · ${pct.toFixed(0)}%</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
      <div class="desc-list">
        ${descEntries.map(([desc,total])=>`<div class="desc-row"><span>${escapeHtml(desc)}</span><span>${formatMoney(total)}</span></div>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function exportarReporteCSV(){
  const rows = window._reportRows || flujo;
  const header = ['Tipo','Categoría','Descripción','Total'];
  const data = [];
  ['ingreso','egreso'].forEach(tipo=>{
    const sub = rows.filter(r=>r.tipo===tipo);
    const totals = {};
    sub.forEach(r=>{
      const key = (r.categoria||'Sin categoría')+'|||'+(r.descripcion||'Sin descripción');
      totals[key] = (totals[key]||0) + r.monto;
    });
    Object.keys(totals).forEach(key=>{
      const [cat, desc] = key.split('|||');
      data.push([tipo, cat, desc, totals[key]]);
    });
  });
  downloadCSV('reporte_categoria_descripcion.csv', header, data);
}

async function submitFlujo(existing){
  const tipo = document.getElementById('m-tipo').value;
  const categoria = document.getElementById('m-categoria').value;
  const fecha = document.getElementById('m-fecha').value;
  const monto = parseFloat(document.getElementById('m-monto').value)||0;
  const descripcion = document.getElementById('m-descripcion').value;

  if(descripcion === '__new__'){ showToast('Confirma la nueva descripción con el botón "Usar esta"', true); return; }
  if(!monto || monto<=0){ showToast('Ingresa un monto válido', true); return; }
  const payload = {fecha, tipo, categoria, monto, descripcion};
  try{
    if(existing){
      const updated = await sbUpdate('flujo_efectivo', existing.id, payload);
      flujo[flujo.findIndex(f=>f.id===existing.id)] = updated;
      showToast('Registro actualizado');
    } else {
      const inserted = await sbInsert('flujo_efectivo', payload);
      flujo.push(inserted);
      showToast('Registro agregado');
    }
    closeModal();
    populateCategoriaFilterOptions();
    refreshAll();

/* ===================== Importar CSV ===================== */
function openImportModal(){
  openModal('Importar CSV', `<div class="modal-body">
    <p style="font-size:13px;color:var(--ink-soft);">Selecciona un CSV con columnas Fecha, Tipo, Categoría, Monto, Descripción (el mismo formato que exporta esta app o la app original).</p>
    <div class="form-row"><input type="file" id="import-file" accept=".csv"></div>
    <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-accent" onclick="procesarImportacion()">Importar</button></div>
  </div>`);
}
async function procesarImportacion(){
  const file = document.getElementById('import-file').files[0];
  if(!file){ showToast('Selecciona un archivo', true); return; }
  const text = (await file.text()).replace(/^\uFEFF/, '');
  const rows = parseCSV(text);
  if(rows.length<2){ showToast('El archivo no tiene datos', true); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    fecha: header.indexOf('fecha'),
    tipo: header.indexOf('tipo'),
    categoria: header.findIndex(h=>h.startsWith('categor')),
    monto: header.indexOf('monto'),
    descripcion: header.findIndex(h=>h.startsWith('descripc'))
  };
  if(idx.fecha<0 || idx.tipo<0 || idx.categoria<0 || idx.monto<0){ showToast('El formato del CSV no coincide con lo esperado', true); return; }
  const nuevos = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length<2) continue;
    const tipoRaw = (r[idx.tipo]||'').trim().toLowerCase();
    const tipo = (tipoRaw==='ingreso'||tipoRaw==='egreso') ? tipoRaw : (tipoRaw==='entrada'?'ingreso': tipoRaw==='salida'?'egreso': null);
    if(!tipo) continue;
    const monto = parseFloat(r[idx.monto]);
    if(!monto || monto<=0) continue;
    nuevos.push({
      fecha: r[idx.fecha], tipo, categoria: r[idx.categoria]||'Sin categoría', monto,
      descripcion: idx.descripcion>-1 ? (r[idx.descripcion]||'') : ''
    });
  }
  if(nuevos.length===0){ showToast('No se encontraron filas válidas', true); return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/flujo_efectivo`, {
      method:'POST',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify(nuevos)
    });
    if(!res.ok) throw new Error();
    const inserted = await res.json();
    flujo.push(...inserted);
    for(const row of nuevos){
      const list = row.tipo==='ingreso' ? categoriasIngreso : categoriasEgreso;
      if(!list.includes(row.categoria)){
        list.push(row.categoria);
        sbUpsert('flujo_categorias', {tipo: row.tipo, nombre: row.categoria}, 'tipo,nombre').catch(()=>{});
      }
    }
    closeModal();
    populateCategoriaFilterOptions();
    refreshAll();
    showToast(`${inserted.length} registros importados`);
  }catch(e){ showToast('No se pudo importar. Revisa tu conexión con Supabase.', true); }
}

async function init(){
  if(!SUPABASE_CONFIGURED){
    document.getElementById('loading-screen').innerHTML = `<div style="max-width:440px;">
      <h3 style="margin:0 0 10px;">Configura Supabase</h3>

    return;
  }
  try{
    const [flujoRows, catRows, descRows, saldoRows] = await Promise.all([
      sbSelect('flujo_efectivo', '?order=fecha.desc'),
      sbSelect('flujo_categorias', '?order=nombre.asc'),
      sbSelect('flujo_descripciones', '?order=descripcion.asc'),

    ]);
    flujo = flujoRows;

    descripcionesPorCategoria = {};
    descRows.forEach(d=>{
      if(!descripcionesPorCategoria[d.categoria]) descripcionesPorCategoria[d.categoria]=[];
      descripcionesPorCategoria[d.categoria].push(d.descripcion);
    });
    saldosIniciales = {};
    saldoRows.forEach(s=>{ saldosIniciales[s.mes] = parseFloat(s.monto)||0; });
    setConnStatus(true);
  }catch(e){
    setConnStatus(false);
    showToast('No se pudo conectar a Supabase. Revisa tu configuración y la conexión a internet.', true);
  }
  document.getElementById('loading-screen')?.remove();
  setDefaultDates();
  populateCategoriaFilterOptions();
  refreshAll();
}
init();
</script>
</body>
</html>
