<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multimaderas Finas del Norte</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f1ec;
            color: #695947;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            width: 300px;
            max-width: 80%;
            height: auto;
            margin-bottom: 25px;
        }

        .titulo {
            font-size: 32px;
            font-weight: bold;
            color: #695947;
            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 16px;
            color: #8a7965;
            margin-bottom: 35px;
        }

        /* CONTENEDOR DE BOTONES */
        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* BOTONES */
        .boton {
            background: #695947;
            color: white;
            text-decoration: none;

            padding: 22px 15px;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);

            transition: all 0.25s ease;
        }

        .boton:hover {
            background: #806e59;
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.20);
        }

        .boton:active {
            transform: translateY(-1px);
        }

        /* PIE DE PÁGINA */
        footer {
            margin-top: 45px;
            color: #8a7965;
            font-size: 14px;
        }

        /* RESPONSIVE PARA CELULAR */
        @media (max-width: 700px) {

            .titulo {
                font-size: 25px;
            }

            .menu {
                grid-template-columns: 1fr;
                max-width: 400px;
            }

            .boton {
                padding: 18px;
            }

            .logo {
                width: 250px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <!-- LOGO -->
        <img
            src="MultiMaderasNormal.png"
            alt="Multimaderas Finas del Norte"
            class="logo"
        >

        <h1 class="titulo">Multimaderas Finas del Norte</h1>

        <p class="subtitulo">
            Selecciona una opción para continuar
        </p>


        <!-- MENÚ PRINCIPAL -->
        <nav class="menu">

            <a href="flujo-efectivo.html" class="boton">
                Flujo de efectivo
            </a>

            <a href="servicios.html" class="boton">
                Servicios
            </a>

            <a href="nosotros.html" class="boton">
                Nosotros
            </a>

            <a href="catalogo.html" class="boton">
                Catálogo
            </a>

            <a href="contacto.html" class="boton">
                Contacto
            </a>

            <a href="ubicacion.html" class="boton">
                Ubicación
            </a>

        </nav>


        <footer>
            © 2026 Multimaderas Finas del Norte
        </footer>

    </main>

</body>
</html>
